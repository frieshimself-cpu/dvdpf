<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DVD CORNER BUY 📀</title>
  <meta name="description" content="Retro DVD screensaver. Every corner hit fires a dev buy. Everyone sees the same bounce." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📀</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="noise" aria-hidden="true"></div>
  <div id="scanlines" aria-hidden="true"></div>
  <div id="bezel" aria-hidden="true"></div>
  <div id="osdPlay" class="osd" aria-hidden="true"><span class="tri">▶</span> PLAY</div>
  <div id="osdTime" class="osd" aria-hidden="true">0:00:00</div>
  <div id="flash" aria-hidden="true"></div>
  <div id="banner" aria-hidden="true">CORNER HIT!</div>

  <div id="caption">
    <span id="captionText"></span>
    <span class="sep">·</span> corners: <strong id="capCorners">0</strong>
    <a id="capBuy" target="_blank" rel="noopener" hidden></a>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
