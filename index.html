<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DVD CORNER BUY 📀</title>
  <meta name="description" content="Retro DVD screensaver. Every corner hit fires a dev buy. Everyone sees the same bounce." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📀</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="scanlines" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>
  <div id="banner" aria-hidden="true">CORNER HIT!</div>

  <div id="caption">
    <span id="captionText"></span>
    <span class="sep">·</span> corners: <strong id="capCorners">0</strong>
    <a id="capBuy" target="_blank" rel="noopener" hidden></a>
  </div>

  <!-- Operator panel: invisible to visitors, appears only with #ctl in the URL -->
  <aside id="panel" hidden>
    <h1>OPERATOR <span class="blink">▮</span></h1>
    <div id="serverStatus" class="status">connecting to server…</div>

    <section>
      <h2>Corner rarity (global — all viewers)</h2>
      <label class="rowlabel" for="odds">
        odds: <strong id="oddsReadout">1 in 100 bounces</strong>
      </label>
      <input id="odds" type="range" min="0" max="1000" value="541" autocomplete="off" />
      <div id="oddsEta" class="hint">expected corner hit: —</div>
      <div class="presets">
        <button type="button" data-odds="1">EVERY</button>
        <button type="button" data-odds="10">1/10</button>
        <button type="button" data-odds="100">1/100</button>
        <button type="button" data-odds="1000">1/1000</button>
        <button type="button" data-odds="5000">1/5000</button>
      </div>
    </section>

    <section>
      <h2>Launch decay</h2>
      <div class="rowlabel">
        cool off to 1 in <input id="decayEnd" type="number" min="1" max="1000000" value="1000" autocomplete="off" />
        over <input id="decayHoursInput" type="number" min="0.1" max="720" step="0.5" value="24" autocomplete="off" /> h
      </div>
      <div class="btnrow">
        <button id="applyDecay" type="button">START DECAY</button>
        <button id="stopDecay" type="button">FREEZE NOW</button>
      </div>
      <div id="decayStatus" class="hint">no decay running</div>
    </section>

    <section>
      <h2>Screensaver (global)</h2>
      <label class="rowlabel" for="speed">speed: <strong id="speedReadout">320</strong></label>
      <input id="speed" type="range" min="60" max="1200" value="320" autocomplete="off" />
      <label class="rowlabel" for="size">logo size: <strong id="sizeReadout">240</strong></label>
      <input id="size" type="range" min="80" max="500" value="240" autocomplete="off" />
      <label class="rowlabel" for="caption">caption text</label>
      <input id="captionInput" type="text" maxlength="120" autocomplete="off" />
    </section>

    <section>
      <h2>Dev buy</h2>
      <label class="armrow">
        <input id="buysEnabled" type="checkbox" autocomplete="off" />
        <span id="buysLabel">buys OFF</span>
      </label>
      <label class="rowlabel" for="adminKey">admin key</label>
      <input id="adminKey" type="password" placeholder="x-admin-key" autocomplete="off" />
      <div class="btnrow">
        <button id="forceCorner" type="button">FORCE CORNER (GLOBAL)</button>
      </div>
    </section>

    <section>
      <h2>Event log</h2>
      <div id="log" class="log"></div>
    </section>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
